name: Check Octopus gas readings API

on:
  workflow_dispatch:
    inputs:
      days:
        description: Number of recent days to compare
        required: true
        default: '7'
        type: choice
        options:
          - '3'
          - '7'
          - '14'
          - '30'

permissions:
  contents: read

jobs:
  check_octopus_kwh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependency
        run: python -m pip install requests==2.32.5

      - name: Compare Octopus kWh and m³ readings
        run: |
          python check_octopus_kwh.py \
            --api-key "${{ secrets.OCTOPUS_API_KEY }}" \
            --mprn "${{ secrets.OCTOPUS_MPRN }}" \
            --gas-serial-number "${{ secrets.OCTOPUS_GAS_SERIAL }}" \
            --account-number "${{ secrets.OCTOPUS_ACCOUNT_NUMBER }}" \
            --days "${{ inputs.days }}"
